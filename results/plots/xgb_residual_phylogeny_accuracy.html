  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #222;
    }
    .page {
      width: 1120px;
      margin: 20px auto;
      position: relative;
    }
    h1 {
      text-align: center;
      font-size: 22px;
      font-weight: 500;
      margin: 10px 0 0;
    }
    .search-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 14px 0 8px;
      flex-wrap: wrap;
    }
    .search-bar input {
      width: min(420px, 72vw);
      padding: 8px 10px;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 14px;
    }
    .search-bar button {
      padding: 8px 14px;
      border: 1px solid #888;
      border-radius: 6px;
      background: #f7f7f7;
      font-size: 14px;
      cursor: pointer;
    }
    .search-bar button:hover {
      background: #ececec;
    }
    #search-status {
      width: 100%;
      text-align: center;
      font-size: 13px;
      color: #666;
      min-height: 18px;
    }
    svg {
      display: block;
      margin: 0 auto;
    }
    .branch {
      fill: none;
      stroke-width: 1.05;
      stroke-linecap: round;
      opacity: 0.86;
      cursor: default;
      transition: stroke-width 0.15s ease, opacity 0.15s ease;
    }
    .branch:hover {
      stroke-width: 3.2;
      opacity: 1;
    }
    .tip-focus-ring {
      fill: none;
      stroke: rgba(241, 5, 91, 0.82);
      stroke-width: 2.4;
      pointer-events: none;
      visibility: hidden;
    }
    #tooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      pointer-events: none;
      max-width: 340px;
      padding: 9px 11px;
      border: 1px solid #bbb;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.16);
      white-space: pre-line;
      font-size: 17px;
      font-weight: bold;
      line-height: 1.35;
      z-index: 1000;
    }
    .legend-title {
      font-size: 16px;
    }
    .legend-label {
      font-size: 12px;
    }
  </style>
</head>

    const tooltip = document.getElementById("tooltip");
    const searchInput = document.getElementById("species-search");
    const searchStatus = document.getElementById("search-status");
    const treeStage = document.getElementById("tree-stage");
    const tipFocusRing = document.getElementById("tip-focus-ring");
    const treeSvg = document.getElementById("tree-svg");
    const defaultTransform = "translate(60, 20) scale(1)";
    const focusScale = 2.35;
    let pinnedTipKey = null;
    let pinnedTooltipText = null;

    function getSvgMetrics() {
      const rect = treeSvg.getBoundingClientRect();
      return {
        rect,
        scaleX: rect.width / 1120,
        scaleY: rect.height / 1040,
      };
    }

    function getScreenCenter() {
      return {
        x: window.innerWidth / 2,
        y: window.innerHeight / 2,
      };
    }

    function tipToClient(tipX, tipY) {
      const ctm = treeStage.getScreenCTM();
      if (!ctm) {
        const { rect, scaleX, scaleY } = getSvgMetrics();
        return {
          x: rect.left + tipX * scaleX,
          y: rect.top + tipY * scaleY,
        };
      }
      const pt = treeSvg.createSVGPoint();
      pt.x = tipX;
      pt.y = tipY;
      const screen = pt.matrixTransform(ctm);
      return { x: screen.x, y: screen.y };
    }

    function normalizeSearchKey(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/[\s_]+/g, " ");
    }

    function placeTooltip(clientX, clientY) {
      const pad = 12;
      const offset = 14;
      tooltip.style.display = "block";
      const width = tooltip.offsetWidth || 220;
      const height = tooltip.offsetHeight || 120;
      let left = clientX + offset;
      let top = clientY + offset;
      if (left + width + pad > window.innerWidth) {
        left = clientX - width - offset;
      }
      if (top + height + pad > window.innerHeight) {
        top = clientY - height - offset;
      }
      left = Math.max(pad, Math.min(left, window.innerWidth - width - pad));
      top = Math.max(pad, Math.min(top, window.innerHeight - height - pad));
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
    }

    function showTooltip(text, clientX, clientY) {
      tooltip.textContent = text;
      placeTooltip(clientX, clientY);
    }

    function hideTooltip() {
      if (pinnedTipKey && pinnedTooltipText) {
        const tip = TIPS.find((item) => item.key === pinnedTipKey);
        if (tip) {
          const screen = tipToClient(tip.x, tip.y);
          showTooltip(pinnedTooltipText, screen.x, screen.y);
          return;
        }
      }
      tooltip.style.display = "none";
    }

    function focusTreeOnTip(tipX, tipY) {
      const { rect, scaleX, scaleY } = getSvgMetrics();
      const center = getScreenCenter();
      const tx = (center.x - rect.left) / scaleX - tipX * focusScale;
      const ty = (center.y - rect.top) / scaleY - tipY * focusScale;
      treeStage.setAttribute(
        "transform",
        `translate(${tx.toFixed(3)}, ${ty.toFixed(3)}) scale(${focusScale})`
      );
    }

    function showTipFocusRing(tipX, tipY) {
      tipFocusRing.setAttribute("cx", tipX.toFixed(3));
      tipFocusRing.setAttribute("cy", tipY.toFixed(3));
      tipFocusRing.style.visibility = "visible";
    }

    function hideTipFocusRing() {
      tipFocusRing.style.visibility = "hidden";
    }

    function resetTreeView() {
      treeStage.setAttribute("transform", defaultTransform);
      pinnedTipKey = null;
      pinnedTooltipText = null;
      hideTipFocusRing();
      searchStatus.textContent = "";
      tooltip.style.display = "none";
    }

    function resolveTip(query) {
      const key = normalizeSearchKey(query);
      if (!key) {
        return null;
      }
      const exact = TIPS.find((tip) => tip.key === key);
      if (exact) {
        return exact;
      }
      const prefixMatches = TIPS.filter((tip) => tip.key.startsWith(key));
      if (prefixMatches.length === 1) {
        return prefixMatches[0];
      }
      const containsMatches = TIPS.filter((tip) => tip.key.includes(key));
      if (containsMatches.length === 1) {
        return containsMatches[0];
      }
      return null;
    }

    function jumpToSpecies(query) {
      const tip = resolveTip(query);
      if (!tip) {
        pinnedTipKey = null;
        pinnedTooltipText = null;
        hideTipFocusRing();
        tooltip.style.display = "none";
        searchStatus.textContent = "No matching species found.";
        return false;
      }

      pinnedTipKey = tip.key;
      pinnedTooltipText = tip.tooltip;
      focusTreeOnTip(tip.x, tip.y);
      showTipFocusRing(tip.x, tip.y);
      searchInput.value = tip.label;
      searchStatus.textContent = `Focused on ${tip.label}`;

      // Place detail card next to the focused tip, not at page bottom / screen center.
      requestAnimationFrame(() => {
        const screen = tipToClient(tip.x, tip.y);
        showTooltip(tip.tooltip, screen.x, screen.y);
      });
      return true;
    }

    document.querySelectorAll(".branch").forEach((branch) => {
      branch.addEventListener("mouseenter", (event) => {
        showTooltip(branch.dataset.tooltip, event.clientX, event.clientY);
      });
      branch.addEventListener("mousemove", (event) => {
        showTooltip(branch.dataset.tooltip, event.clientX, event.clientY);
      });
      branch.addEventListener("mouseleave", () => {
        hideTooltip();
      });
    });

    document.getElementById("search-go").addEventListener("click", () => {
      jumpToSpecies(searchInput.value);
    });
    document.getElementById("search-reset").addEventListener("click", resetTreeView);
    searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        jumpToSpecies(searchInput.value);
      }
    });
